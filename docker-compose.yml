services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: woningwaker
      POSTGRES_PASSWORD: woningwaker
      POSTGRES_DB: woningwaker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woningwaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # De web-app en worker draaien lokaal buiten Docker in dev (npm run dev).
  # Voor een volledige containerbuild is een Dockerfile meegeleverd; ontkoppel
  # onderstaande services om alles in Docker te draaien.
  #
  # web:
  #   build: .
  #   env_file: .env
  #   depends_on:
  #     db: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   ports:
  #     - "3000:3000"

volumes:
  db_data:
  redis_data:
